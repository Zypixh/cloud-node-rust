[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
mace-kv = "=0.1.0"
rust-rocksdb = { version = "=0.50.0", features = ["lz4"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
