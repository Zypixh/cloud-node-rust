[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
default = []
migrate-metrics = [
    "dep:mace-kv",
    "dep:rust-rocksdb",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:hex",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = { version = "0.4.3", optional = true }
mace-kv = { version = "0.1.1", optional = true }
rust-rocksdb = { version = "0.50.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.0", optional = true }
