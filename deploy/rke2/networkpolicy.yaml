apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-node-internal-only
  namespace: cloud-node
spec:
  podSelector:
    matchLabels:
      app: cloud-node
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloud-node
      ports:
        - protocol: TCP
          port: 19090
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 443
