apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-node
  namespace: cloud-node
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-node-lease
  namespace: cloud-node
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-node-lease
  namespace: cloud-node
subjects:
  - kind: ServiceAccount
    name: cloud-node
    namespace: cloud-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-node-lease
