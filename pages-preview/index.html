<script>

function T(){return L==='zh'?{t:'安全验证',c:'正在检查您的浏览器…',cs:'请稍候，我们正在验证您的浏览器能力。',pw:'正在计算工作量证明 (difficulty=4)',st:'请完成滑块验证',ss:'拖动拼图块到缺口位置以验证您不是机器人。',sg:'将拼图块拖拽到缺口位置',sr:'位置未对准，请重试',so:'验证成功',ck:'请在下方图片中按序号点击字符',ch:'点击图片中的字符',cd:'✓ 全部正确',cp:'请输入验证码',cps:'请输入下方图片中显示的字符',cpp:'输入验证码',cbt:'验证',bt:'访问被拒绝',bb:'您的请求已被安全策略拦截。如有疑问请联系网站管理员。',ft:'安全防护提供',nj:'此安全验证需要启用 JavaScript。',id:'21a85f7d'}

function C(){return`:root{color-scheme:light dark;--bg:linear-gradient(135deg,#f6f8fb,#e8ecf1);--card-bg:rgba(255,255,255,.96);--card-border:rgba(15,23,42,.08);--text:#1f2937;--muted:#667085;--dim:#98a2b3;--green:#22c55e;--blue:#0ea5e9;--red:#dc2626;--waf:linear-gradient(135deg,#6366f1,#38bdf8);--block:linear-gradient(135deg,#ef4444,#f97316);--shadow:0 20px 60px rgba(15,23,42,.1);--lang-bg:rgba(15,23,42,.04)}@media(prefers-color-scheme:dark){:root{--bg:linear-gradient(135deg,#0f172a,#111827 55%,#1e293b);--card-bg:rgba(24,34,48,.94);--card-border:rgba(255,255,255,.1);--text:#f9fafb;--muted:#aeb8c7;--dim:#667085;--shadow:0 20px 60px rgba(0,0,0,.4);--lang-bg:rgba(255,255,255,.06)}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text)}.lang-bar{position:fixed;top:14px;right:16px;display:flex;align-items:center;gap:10px;z-index:10}.lang-req{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace;background:var(--lang-bg);padding:4px 10px;border-radius:999px}.lang-btn{font-size:13px;font-weight:600;color:var(--text);background:var(--lang-bg);border:1px solid var(--card-border);padding:5px 14px;border-radius:999px;cursor:pointer;transition:all .15s}.lang-btn:hover{background:var(--text);color:#fff}.card{width:min(92vw,480px);padding:40px 34px;border-radius:20px;background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--shadow);text-align:center}.mark{width:58px;height:58px;margin:0 auto 22px;border-radius:18px;box-shadow:0 14px 34px rgba(99,102,241,.3)}.mark.waf{background:var(--waf)}.mark.block{background:var(--block)}h1{margin:0 0 10px;font-size:23px;font-weight:700}p{margin:0 0 24px;color:var(--muted);line-height:1.65;font-size:15px}.progress,.track{height:46px;border-radius:999px;background:rgba(148,163,184,.18);overflow:hidden;position:relative}.progress span{display:block;width:42%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--blue));animation:pulse 1.3s ease-in-out infinite}.track{border:1px solid var(--card-border);touch-action:none;cursor:pointer}.track:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 13px,rgba(148,163,184,.12) 14px 16px);border-radius:999px}.status{margin-top:14px;font-size:14px;color:var(--muted)}.meta{margin-top:18px;font-size:12px;color:var(--dim)}@keyframes pulse{0%,100%{transform:translateX(-18%)}50%{transform:translateX(150%)}}`}
function LB(t){return`<nav class="lang-bar"><span class="lang-req">#${t.id}</span><button class="lang-btn" onclick="parent.setLang('${L==='zh'?'en':'zh'}')" title="${L==='zh'?'Switch to English':'切换到中文'}">${L==='zh'?'English':'中文'}</button></nav>`}
function PG(t,b,s){return`<!doctype html><html lang="${L==='zh'?'zh-CN':'en'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${t.t}</title><style>${C()}</style></head><body>${LB(t)}${b}${s?'<script>'+s+'<\/script>':''}</body></html>`}

var poly='polygon(56% 3%,68% 4%,81% 10%,92% 18%,97% 30%,98% 45%,95% 58%,88% 72%,76% 83%,62% 94%,47% 97%,34% 93%,20% 84%,10% 72%,5% 56%,3% 40%,5% 25%,14% 10%,27% 4%,40% 2%,48% 3%,53% 7%,51% 10%,44% 6%)';
var charsEN=['A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R','S','T','U','V','W','X','Y','Z'];

function sliderJS(t){return`(function(){var d=!1,sx=0,sy=0,px=0,py=0;var pc=document.getElementById('pc'),st=document.getElementById('st');if(!pc)return;px=parseFloat(pc.style.left)||0;py=parseFloat(pc.style.top)||0;function ds(e){d=!0;sx=(e.touches?e.touches[0]:e).clientX;sy=(e.touches?e.touches[0]:e).clientY;px=parseFloat(pc.style.left)||px;py=parseFloat(pc.style.top)||py;pc.style.cursor='grabbing'}function dm(e){if(!d)return;e.preventDefault();var p=e.touches?e.touches[0]:e;pc.style.left=Math.max(0,Math.min(280,px+p.clientX-sx))+'px';pc.style.top=Math.max(0,Math.min(160,py+p.clientY-sy))+'px'}function de(){if(!d)return;d=!1;pc.style.cursor='grab';st.textContent='${t.so}';st.style.color='var(--green)'}pc.addEventListener('mousedown',ds);document.addEventListener('mousemove',dm);document.addEventListener('mouseup',de);pc.addEventListener('touchstart',ds,{passive:!0});document.addEventListener('touchmove',dm,{passive:!1});document.addEventListener('touchend',de)})()`}

function clickJS(t){return`
(function(){
var chars=[],order=[],positions=[];for(var i=0;i<5;i++){chars.push(String.fromCharCode(65+Math.floor(Math.random()*26)));order.push(i);positions.push([50+Math.floor(Math.random()*320),60+Math.floor(Math.random()*140)])}
for(var i=4;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=order[i];order[i]=order[j];order[j]=tmp}
var clicked=[!1,!1,!1,!1,!1],next=0,lastClick=0,cv=document.createElement('canvas'),ctx=cv.getContext('2d'),w=420,h=260;

var st=document.createElement('p');st.className='status';st.style.fontSize='14px';st.textContent='\\xa0';
var bf=document.createElement('div'),card=document.querySelector('.card');

for(var i=0;i<12;i++){ctx.fillStyle='rgba(0,0,0,'+(.02+Math.random()*.04)+')';ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,3+Math.random()*18,0,Math.PI*2);ctx.fill()}

for(var i=0;i<30;i++){ctx.fillStyle=clrs[i%5];ctx.globalAlpha=.08+Math.random()*.06;ctx.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*3,2+Math.random()*3)}ctx.globalAlpha=1;
for(var i=0;i<4;i++){ctx.strokeStyle='rgba(0,0,0,'+(.06+Math.random()*.08)+')';ctx.lineWidth=1+Math.random()*2;ctx.beginPath();ctx.moveTo(0,Math.random()*h);ctx.bezierCurveTo(w*.3,Math.random()*h,w*.6,Math.random()*h,w,Math.random()*h);ctx.stroke()}
for(var i=0;i<5;i++){var idx=order[i],x=positions[idx][0],y=positions[idx][1];ctx.save();ctx.translate(x,y);ctx.rotate((Math.random()-.5)*.5);ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=4;ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(chars[idx],0,0);var ccc=['#111827','#991b1b','#1e40af','#6d28d9','#065f46'];ctx.fillStyle=ccc[idx%5];ctx.globalAlpha=.75+Math.random()*.25;ctx.fillText(chars[idx],0,0);ctx.globalAlpha=.12;ctx.fillText(chars[idx],-1.5+Math.random()*2,-1.5+Math.random()*2);ctx.globalAlpha=1;ctx.beginPath();ctx.arc(-22,-18,13,0,Math.PI*2);ctx.fillStyle=clrs[i%5];ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText(i+1,-22,-17);ctx.restore()}
ctx.strokeStyle='rgba(0,0,0,.03)';ctx.lineWidth=.5;for(var i=0;i<w+h;i+=16){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-h,h);ctx.stroke()}}
draw();var t0=Date.now();
cv.addEventListener('click',function(e){var t=Date.now();if(t-lastClick<400)return;lastClick=t;var rect=cv.getBoundingClientRect(),mx=(e.clientX-rect.left)*w/rect.width,my=(e.clientY-rect.top)*h/rect.height,best=-1,bd=1e9;
for(var i=0;i<5;i++){var dx=mx-positions[i][0],dy=my-positions[i][1],d=dx*dx+dy*dy;if(d<1225&&d<bd){bd=d;best=i}}
if(best<0||clicked[best])return;
if(order[next]===best){clicked[best]=!0;next++;ctx.fillStyle='rgba(34,197,94,.3)';ctx.beginPath();ctx.arc(positions[best][0],positions[best][1],22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('\\u2713',positions[best][0],positions[best][1]);if(next===5)st.textContent='${t.cd}'}else{st.textContent='\\u2717';st.style.color='var(--red)';setTimeout(function(){st.textContent='';st.style.color=''},600)}});
})()`}

function captchaJS(t){return`(function(){
var code='';for(var i=0;i<6;i++)code+=String.fromCharCode(65+Math.floor(Math.random()*26));
var c=document.getElementById('cap'),ctx=c.getContext('2d'),w=310,h=110;

var bgClrs=['#f0f1f5','#eef0f4','#f2f3f7','#eceef3','#f1f2f6'];

for(var x=6;x<w;x+=6)for(var y=6;y<h;y+=6){ctx.fillStyle='rgba(0,0,0,'+(.03+Math.random()*.04)+')';ctx.beginPath();ctx.arc(x+(Math.random()-.5)*3,y+(Math.random()-.5)*3,.6+Math.random()*.8,0,Math.PI*2);ctx.fill()}
for(var i=0;i<20;i++){ctx.fillStyle='rgba(0,0,0,'+(.02+Math.random()*.04)+')';ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,1+Math.random()*5,0,Math.PI*2);ctx.fill()}

for(var i=0;i<4;i++){ctx.strokeStyle='rgba(0,0,0,'+(.04+Math.random()*.05)+')';ctx.lineWidth=1+Math.random();ctx.beginPath();ctx.moveTo(40+i*70,0);for(var y=0;y<h;y+=8)ctx.lineTo(40+i*70+Math.sin(y*.08)*8,y);ctx.stroke()}
for(var i=0;i<100;i++){ctx.fillStyle='rgba(0,0,0,'+(.06+Math.random()*.1)+')';ctx.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*3)}
ctx.strokeStyle='rgba(0,0,0,.025)';ctx.lineWidth=.5;for(var i=0;i<w+h;i+=12){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-h,h);ctx.stroke()}
}
draw();c.onclick=draw;
var btn=document.getElementById('cbtn'),inp=document.getElementById('cinp'),st=document.getElementById('cst');
btn.onclick=function(){var v=inp.value.trim().toUpperCase().replace(/\\s+/g,'');st.textContent=v===code?'${t.cd}':(L==='zh'?'✗ 不正确':'✗ Incorrect');st.style.color=v===code?'var(--green)':'var(--red)';};
})()`}

function render(){
 var t=T();var b='',s='';
 if(P==='js-cookie'){b=`<main class="card"><div class="mark waf"></div><h1>${t.c}</h1><p>${t.cs}</p><div class="progress"><span></span></div><div class="meta">${t.ft} · Request #${t.id}</div></main>`}
 else if(P==='pow'){b=`<main class="card"><div class="mark waf"></div><h1>${t.c}</h1><p>${t.pw}</p><div class="progress"><span></span></div><div class="meta">${t.ft} · Request #${t.id}</div></main>`}
 else if(P==='puzzle'){b=`<main class="card"><div class="mark waf"></div><h1>${t.st}</h1><p>${t.ss}</p><div class="pzl-bg" style="position:relative;width:320px;height:200px;margin:0 auto 14px;border-radius:12px;overflow:hidden"><canvas width="320" height="200" style="display:block;width:320px;height:200px" id="bgcv"></canvas><div style="position:absolute;left:180px;top:100px;width:40px;height:40px;clip-path:${poly};background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.25);pointer-events:none;border-radius:2px"></div><div id="pc" style="position:absolute;left:60px;top:90px;width:40px;height:40px;clip-path:${poly};background:linear-gradient(135deg,rgba(99,102,241,.65),rgba(56,189,248,.65));cursor:grab;border-radius:2px;z-index:2"></div></div><p class="status" id="st">${t.sg}</p><div class="meta">${t.ft} · Request #${t.id}</div></main>`;s=sliderJS(t)+`(function(){var c=document.getElementById('bgcv'),ctx=c.getContext('2d'),g=ctx.createLinearGradient(0,0,320,200);g.addColorStop(0,'#6366f1');g.addColorStop(.5,'#38bdf8');g.addColorStop(1,'#22c55e');ctx.fillStyle=g;ctx.fillRect(0,0,320,200);ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.5;for(var x=0;x<320;x+=7){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,200);ctx.stroke()}for(var y=0;y<200;y+=7){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(320,y);ctx.stroke()}for(var i=0;i<24;i++){ctx.fillStyle='rgba(255,255,255,'+(.04+Math.random()*.06)+')';ctx.beginPath();ctx.arc(Math.random()*320,Math.random()*200,3+Math.random()*14,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='rgba(255,255,255,.04)';for(var i=0;i<320+200;i+=14){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-200,200);ctx.stroke()}for(var i=0;i<45;i++){ctx.fillStyle='rgba(255,255,255,'+(.05+Math.random()*.08)+')';ctx.fillRect(Math.random()*320,Math.random()*200,1+Math.random()*3,1+Math.random()*3)}for(var i=0;i<5;i++){ctx.strokeStyle='rgba(255,255,255,'+(.06+Math.random()*.06)+')';ctx.lineWidth=1.5+Math.random()*2;ctx.beginPath();ctx.arc(Math.random()*320,Math.random()*200,10+Math.random()*30,0,Math.PI*2);ctx.stroke()}})();`}
 else if(P==='click'){b=`<main class="card"><div class="mark waf"></div><h1>${t.st}</h1><p>${t.ck}</p><p style="font-size:11px;color:var(--dim);margin-top:-16px">${t.ch}</p><div class="meta">${t.ft} · Request #${t.id}</div></main>`;s=clickJS(t)}
