[package]
name = "cloud-node-rust"
version = "1.2.0"
edition = "2024"
rust-version = "1.96.0"

[dependencies]
aes = "0.9.1"
anyhow = "1.0.102"
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1"
cfb-mode = "0.9.1"
dashmap = "6.1.0"
clap = { version = "4", features = ["derive"] }
http = "1.4.0"
hmac = "0.13.0"
h2 = "0.4.13"
h3 = "0.0.8"
h3-quinn = "0.0.10"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ipnet = "2.11.0"
md-5 = "0.11.0"
pingora = { path = "./pingora-main/pingora", features = ["proxy", "cache", "rustls"] }
pingora-core = { path = "./pingora-main/pingora-core", features = ["rustls"] }
pingora-load-balancing = { path = "./pingora-main/pingora-load-balancing", features = ["rustls"] }
pingora-proxy = { path = "./pingora-main/pingora-proxy", features = ["rustls"] }
pingora-http = { path = "./pingora-main/pingora-http" }
pingora-cache = { path = "./pingora-main/pingora-cache", features = ["rustls"] }
pingora-memory-cache = { path = "./pingora-main/pingora-memory-cache" }
bloom = "0.3"
prost = "0.14.4"
regex = "1.12.3"
aho-corasick = "1.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
quinn = "0.11.9"
rustls = { version = "0.23.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.3"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = "0.6"
flate2 = "1.0"
futures-util = "0.3"
md5_legacy = { package = "md5", version = "0.8.0" }
brotli = "8.0.3"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"
tonic = { version = "0.14.6", features = ["gzip"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.15.1", features = ["v4"] }
webp = "0.3.1"
sysinfo = "0.39.3"
hostname = "0.4"
x509-parser = "0.18.1"
num_cpus = "1"
local-ip-address = "0.6"
governor = "0.10.4"
maxminddb = "0.28.1"
lru = "0.18.0"
moka = { version = "0.12", default-features = false, features = ["sync"] }
zstd = "0.13.2"
chrono = "0.4.39"
hex = "0.4.3"
woothee = "0.13.0"
mace-kv = { git = "https://github.com/abbycin/mace.git", rev = "e04c0cb7126d099eb30bb059fbad1455ea8b5d00" }
rand = "0.8"
libinjectionrs = { path = "vendor/libinjectionrs" }
libc = "0.2"
parking_lot = "0.12"
aes-gcm = "0.10.3"
async-compression = { version = "0.4.42", features = ["tokio", "zstd"] }
arc-swap = "1"
ahash = "0.8"
cloud-node-xdp-common = { path = "crates/cloud-node-xdp-common", features = ["aya"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"
neli = "0.7.4"
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "async", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
xsk-rs = "0.8.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "async", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }

[[bench]]
name = "template_bench"
harness = false

[[bench]]
name = "lb_bench"
harness = false

[[bench]]
name = "firewall_bench"
harness = false

[[bench]]
name = "rewrite_bench"
harness = false

[[bench]]
name = "config_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "metrics_bench"
harness = false

[[bench]]
name = "headers_bench"
harness = false

[[bench]]
name = "analyzer_bench"
harness = false

[[bench]]
name = "auth_bench"
harness = false

[[bench]]
name = "persistence_bench"
harness = false

[[bench]]
name = "time_bench"
harness = false

[[bench]]
name = "utils_bench"
harness = false

[[bench]]
name = "logging_bench"
harness = false

[[bench]]
name = "hotpath_bench"
harness = false

[[bench]]
name = "config_models_bench"
harness = false

[[bench]]
name = "targeted_hotspots_bench"
harness = false

[build-dependencies]
tonic-prost-build = "0.14.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
