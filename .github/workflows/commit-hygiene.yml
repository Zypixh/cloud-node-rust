name: Commit Hygiene

# 署名与提交信息门禁。规则实现见 scripts/git-hooks/check-attribution.sh，
# 本地钩子与这里共用同一份规则，避免两套标准漂移。
#
# 注意：main 目前没有分支保护，所以这个检查在直接 push 时只会"变红"，
# 不会阻断推送。要让它真正拦人，需要在仓库设置里把 main 保护起来，
# 并把 "Attribution / commit-message check" 设为必需检查。

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  attribution:
    name: Attribution / commit-message check
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 必须全量拉取：浅克隆算不出 base..head 的完整提交范围，
          # 范围检查会静默退化成一个提交。
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BASE"
          fi
          head="$HEAD_SHA"

          # before 为全 0 表示新建分支或首次推送，没有可用的 base，
          # 退化为只检查 head 这一个提交。
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::无可用 base（新建分支或首次推送），只检查 $head"
            echo "range=$head" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 用 merge-base 而不是 base 本身：base 分支前进之后直接取 base..head
          # 会把不属于本次改动的提交一并算进来，误报别人的历史提交。
          if merge_base=$(git merge-base "$base" "$head" 2>/dev/null); then
            echo "range=$merge_base..$head" >> "$GITHUB_OUTPUT"
          else
            echo "range=$base..$head" >> "$GITHUB_OUTPUT"
          fi

      - name: Check attribution
        run: |
          set -euo pipefail
          bash scripts/git-hooks/check-attribution.sh --range '${{ steps.range.outputs.range }}'
