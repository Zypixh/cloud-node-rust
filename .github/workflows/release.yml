name: Release

# Tags only: pushing v* is the release decision; main/PR coverage lives in
# ci.yml. No paths filter — a tag push always means "build this release",
# regardless of which files the tagged diff touches.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build - ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- x86_64 Variants ---
          - target: x86_64-unknown-linux-gnu
            cpu: x86-64-v2
            name: linux-x64-v2-sse4.2
            rustflags: "-C target-cpu=x86-64-v2 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
          - target: x86_64-unknown-linux-gnu
            cpu: x86-64-v3
            name: linux-x64-v3-avx2
            rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
          - target: x86_64-unknown-linux-gnu
            cpu: x86-64-v4
            name: linux-x64-v4-avx512
            rustflags: "-C target-cpu=x86-64-v4 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"

          # --- ARM64 Variants ---
          - target: aarch64-unknown-linux-gnu
            cpu: generic
            name: linux-arm64-generic
            rustflags: "-C target-feature=+neon,+aes,+sha2,+crc"
            cxxflags: ""
          - target: aarch64-unknown-linux-gnu
            cpu: neoverse-n1
            name: linux-arm64-neoverse-n1
            rustflags: "-C target-cpu=neoverse-n1"
            cxxflags: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Normalize Rust Toolchains
        shell: bash
        env:
          RELEASE_RUST_VERSION: "1.98.1"
        run: |
          set -euo pipefail

          rustup default "$RELEASE_RUST_VERSION"
          rustup target add "${{ matrix.target }}" --toolchain "$RELEASE_RUST_VERSION"

          while IFS= read -r line; do
            toolchain="${line%% *}"
            if [ -z "$toolchain" ]; then
              continue
            fi

            case "$toolchain" in
              "$RELEASE_RUST_VERSION"|"$RELEASE_RUST_VERSION"-*)
                ;;
              *)
                rustup toolchain uninstall "$toolchain" || true
                ;;
            esac
          done < <(rustup toolchain list --quiet)

          rustup toolchain list --quiet

      - name: Install dependencies & Cross-Linkers
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          packages=(cmake build-essential golang-go protobuf-compiler pkg-config libelf-dev zlib1g-dev libpcap0.8-dev)

          # GitHub ubuntu-22.04 runners pin apt to azure.archive.ubuntu.com via
          # Mirrorlist. When that host stalls, apt-get update hangs until the
          # job timeout. Pin archive.ubuntu.com (and ports for arm64) instead.
          sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF
          sudo mkdir -p /etc/apt/sources.list.d.disabled
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.d.disabled/sources.list 2>/dev/null || true
          sudo mv /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d.disabled/apt-mirrors.txt 2>/dev/null || true
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -e "$source" ] || continue
            sudo mv "$source" /etc/apt/sources.list.d.disabled/
          done
          sudo tee /etc/apt/sources.list.d/ubuntu-amd64.list >/dev/null <<'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF

          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo dpkg --add-architecture arm64
            sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
            packages+=(gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libelf-dev:arm64 zlib1g-dev:arm64 libpcap0.8-dev:arm64)
          fi
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done

      # mbx shared build cache. `backend: local` only installs mbx; cache
      # transport is the actions/cache step below. The action's `github`
      # backend would be restore-only here — it saves solely on
      # default-branch pushes, and this workflow is tag-only by design, so
      # tag builds must own their save policy or the store stays cold
      # forever. Each matrix leg keeps its own store (RUSTFLAGS differ per
      # leg, so compilation fingerprints do too); a respin restores the
      # previous run's entry via the restore-key prefix.
      - name: Install mbx
        uses: jdx/mr-boxington-action@v1
        with:
          backend: local
          version: "1.14.0"

      - name: mbx store cache
        uses: actions/cache@v4
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          CFLAGS: ${{ matrix.cxxflags }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
            ~/.cache/mbx
          key: release-mbx-v1-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            release-mbx-v1-${{ matrix.name }}-

      # The eBPF toolchain and object MUST be ready before the node build:
      # build.rs embeds the object designated by CLOUD_NODE_XDP_EBPF_SOURCE,
      # so the embedded bytes are byte-identical to the packaged object by
      # construction, and CLOUD_NODE_XDP_EBPF_SHA256 makes any stale or
      # foreign object a hard build failure rather than a silent embed.
      - name: Install eBPF Toolchain
        shell: bash
        env:
          # bpf-linker is pinned to the combination verified in validation;
          # bumping it requires re-running the XDP/AF_XDP smoke matrix.
          BPF_LINKER_VERSION: "0.11.1"
        run: |
          set -euo pipefail
          # The dated nightly lives in one place only: the eBPF crate's
          # rust-toolchain.toml. xtask `build-ebpf` and build.rs resolve the
          # same channel, so the toolchain installed here is provably the one
          # every downstream consumer uses.
          EBPF_NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/cloud-node-xdp-ebpf/rust-toolchain.toml | head -1)"
          test -n "$EBPF_NIGHTLY"
          echo "EBPF_NIGHTLY=$EBPF_NIGHTLY" >> "$GITHUB_ENV"
          rustup toolchain install "$EBPF_NIGHTLY" --profile minimal -c rust-src -c rustc-dev
          rustup run "$EBPF_NIGHTLY" rustc --version
          # bpf-linker links against libLLVM (>= the LLVM providing
          # LLVMGetDINodeTag). Distro LLVM is too old; the toolchain's own
          # rustc-dev component ships the version-exact shared lib, so
          # point LLVM_PREFIX at the sysroot and provide the unversioned
          # soname the linker looks for.
          SYSROOT="$(rustup run "$EBPF_NIGHTLY" rustc --print sysroot)"
          ln -sf "$(find "$SYSROOT/lib" -name 'libLLVM.so.*' -print -quit)" "$SYSROOT/lib/libLLVM.so"
          export LLVM_PREFIX="$SYSROOT"
          # Plain cargo, not mbx: `+toolchain` is rustup-shim syntax that
          # mbx does not forward, and this one-off host tool gains nothing
          # from the compilation cache.
          cargo +"$EBPF_NIGHTLY" install bpf-linker --version "$BPF_LINKER_VERSION" --locked
          bpf-linker --version

      - name: Build XDP eBPF Object
        shell: bash
        run: |
          set -euo pipefail
          # Never let a stale object survive into the package: remove any
          # checked-in or cached artifact before rebuilding from source.
          rm -f data/cloud-node-xdp-ebpf.o
          mbx xtask build-ebpf
          test -s data/cloud-node-xdp-ebpf.o
          sha256sum data/cloud-node-xdp-ebpf.o
          sha256sum data/cloud-node-xdp-ebpf.o | awk '{print $1}' > ebpf-sha256.txt

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          CFLAGS: ${{ matrix.cxxflags }}
          CLOUD_NODE_XDP_EBPF_SOURCE: data/cloud-node-xdp-ebpf.o
        run: |
          set -euo pipefail
          export CLOUD_NODE_XDP_EBPF_SHA256="$(cat ebpf-sha256.txt)"
          # 1. Handle ARM Linkers
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=aarch64-linux-gnu-ar
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            export LD=aarch64-linux-gnu-ld
            export AR=aarch64-linux-gnu-ar
            export OBJCOPY=aarch64-linux-gnu-objcopy
            export READELF=aarch64-linux-gnu-readelf
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          fi

          mbx build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_BINARY="cloud-node-rust"
          TARGET_BINARY="cloud-node"
          PACKAGE_NAME="cloud-node-rust-${{ matrix.name }}"

          # Re-verify the packaged object still matches what build.rs
          # embedded (same file by construction; belt-and-suspenders).
          test "$(sha256sum data/cloud-node-xdp-ebpf.o | awk '{print $1}')" = "$(cat ebpf-sha256.txt)"

          mkdir -p dist/data
          cp target/${{ matrix.target }}/release/$ORIGINAL_BINARY dist/$TARGET_BINARY
          cp data/cloud-node-xdp-ebpf.o dist/data/cloud-node-xdp-ebpf.o
          {
            echo "binary=$(basename "$TARGET_BINARY") target=${{ matrix.target }} variant=${{ matrix.name }}"
            echo "binary_sha256=$(sha256sum "dist/$TARGET_BINARY" | awk '{print $1}')"
            echo "ebpf_sha256=$(cat ebpf-sha256.txt)"
            echo "ebpf_toolchain=${EBPF_NIGHTLY} bpf-linker=0.11.1"
          } > dist/SHA256SUMS.txt
          cd dist
          tar -czf ../$PACKAGE_NAME.tar.gz $TARGET_BINARY data/cloud-node-xdp-ebpf.o SHA256SUMS.txt
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cloud-node-rust-${{ matrix.name }}.tar.gz

      # Bound the mbx store before actions/cache saves it — GitHub caps a
      # repo's cache at ~10 GB across all entries, and each matrix leg
      # saves its own entry. A missing object is rebuilt on demand, so
      # pruning only costs hits, never correctness.
      - name: Prune mbx store
        if: always()
        shell: bash
        run: mbx gc --max-size 1500MB || true

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Notes
        shell: bash
        run: |
          mkdir -p .github/release-body
          RELEASE_NOTE="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$RELEASE_NOTE" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            RELEASE_NOTE="release-notes/${GITHUB_REF_NAME#v}.md"
          fi
          if [ -f "$RELEASE_NOTE" ]; then
            cp "$RELEASE_NOTE" .github/release-body/body.md
          else
            {
              echo "# ${GITHUB_REF_NAME}"
              echo
              echo "未找到对应的发布说明文件：release-notes/${GITHUB_REF_NAME}.md 或 release-notes/${GITHUB_REF_NAME#v}.md"
            } > .github/release-body/body.md
          fi

      - name: Package TOA Sources
        shell: bash
        run: |
          tar -czf cloud-node-rust-toa-main-source.tar.gz toa-main
          tar -czf cloud-node-rust-toa-sender-source.tar.gz toa-sender

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-body/body.md
          # RC/beta/alpha tags are published as prereleases — they are
          # validation artifacts, not production releases.
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            artifacts/**/*.tar.gz
            cloud-node-rust-toa-main-source.tar.gz
            cloud-node-rust-toa-sender-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
