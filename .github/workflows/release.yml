name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/**'
      - '.cargo/**'
      - 'pingora-main/**'
      - 'toa-main/**'
      - 'toa-sender/**'
      - 'vendor/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: Build - ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- x86_64 Variants ---
          - target: x86_64-unknown-linux-gnu
            cpu: x86-64-v2
            name: linux-x64-v2-sse4.2
            rustflags: "-C target-cpu=x86-64-v2 -C opt-level=3 -C lto=fat -C codegen-units=1 -C embed-bitcode=yes -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
          - target: x86_64-unknown-linux-gnu
            cpu: x86-64-v3
            name: linux-x64-v3-avx2
            rustflags: "-C target-cpu=x86-64-v3 -C opt-level=3 -C lto=fat -C codegen-units=1 -C embed-bitcode=yes -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
          - target: x86_64-unknown-linux-gnu
            cpu: x86-64-v4
            name: linux-x64-v4-avx512
            rustflags: "-C target-cpu=x86-64-v4 -C opt-level=3 -C lto=fat -C codegen-units=1 -C embed-bitcode=yes -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"

          # --- ARM64 Variants ---
          - target: aarch64-unknown-linux-gnu
            cpu: generic
            name: linux-arm64-generic
            rustflags: "-C opt-level=3 -C lto=fat -C codegen-units=1 -C target-feature=+neon,+aes,+sha2,+crc -C embed-bitcode=yes"
            cxxflags: ""
          - target: aarch64-unknown-linux-gnu
            cpu: neoverse-n1
            name: linux-arm64-neoverse-n1
            rustflags: "-C target-cpu=neoverse-n1 -C opt-level=3 -C lto=fat -C codegen-units=1 -C embed-bitcode=yes"
            cxxflags: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Normalize Rust Toolchains
        shell: bash
        env:
          RELEASE_RUST_VERSION: "1.96.0"
        run: |
          set -euo pipefail

          rustup default "$RELEASE_RUST_VERSION"
          rustup target add "${{ matrix.target }}" --toolchain "$RELEASE_RUST_VERSION"

          while IFS= read -r line; do
            toolchain="${line%% *}"
            if [ -z "$toolchain" ]; then
              continue
            fi

            case "$toolchain" in
              "$RELEASE_RUST_VERSION"|"$RELEASE_RUST_VERSION"-*)
                ;;
              *)
                rustup toolchain uninstall "$toolchain" || true
                ;;
            esac
          done < <(rustup toolchain list --quiet)

          rustup toolchain list --quiet

      - name: Install dependencies & Cross-Linkers
        timeout-minutes: 25
        run: |
          packages=(cmake build-essential golang-go protobuf-compiler pkg-config libelf-dev zlib1g-dev)
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo dpkg --add-architecture arm64
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i -E '/^deb / s#^deb (https?://)#deb [arch=amd64] \1#' /etc/apt/sources.list
            fi
            for source in /etc/apt/sources.list.d/*.list; do
              [ -e "$source" ] || continue
              sudo sed -i -E '/^deb / s#^deb (https?://)#deb [arch=amd64] \1#' "$source"
            done
            for source in /etc/apt/sources.list.d/*.sources; do
              [ -e "$source" ] || continue
              if grep -q '^Architectures:' "$source"; then
                sudo sed -i -E 's/^Architectures:.*/Architectures: amd64/' "$source"
              else
                sudo sed -i '/^Components:/a Architectures: amd64' "$source"
              fi
            done
            sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
            packages+=(gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libelf-dev:arm64 zlib1g-dev:arm64)
          fi
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          CFLAGS: ${{ matrix.cxxflags }}
        with:
          key: release-${{ matrix.name }}-${{ matrix.target }}-${{ matrix.cpu }}
          shared-key: release-${{ matrix.name }}-${{ matrix.target }}-${{ matrix.cpu }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          env-vars: "RUSTFLAGS CXXFLAGS CFLAGS"

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          CFLAGS: ${{ matrix.cxxflags }}
        run: |
          # 1. Handle ARM Linkers
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          fi
          
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ORIGINAL_BINARY="cloud-node-rust"
          TARGET_BINARY="cloud-node"
          PACKAGE_NAME="cloud-node-rust-${{ matrix.name }}"
          
          mkdir -p dist
          cp target/${{ matrix.target }}/release/$ORIGINAL_BINARY dist/$TARGET_BINARY
          cd dist
          tar -czf ../$PACKAGE_NAME.tar.gz $TARGET_BINARY
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cloud-node-rust-${{ matrix.name }}.tar.gz

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Notes
        shell: bash
        run: |
          mkdir -p .github/release-body
          RELEASE_NOTE="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$RELEASE_NOTE" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            RELEASE_NOTE="release-notes/${GITHUB_REF_NAME#v}.md"
          fi
          if [ -f "$RELEASE_NOTE" ]; then
            cp "$RELEASE_NOTE" .github/release-body/body.md
          else
            {
              echo "# ${GITHUB_REF_NAME}"
              echo
              echo "未找到对应的发布说明文件：release-notes/${GITHUB_REF_NAME}.md 或 release-notes/${GITHUB_REF_NAME#v}.md"
            } > .github/release-body/body.md
          fi

      - name: Package TOA Sources
        shell: bash
        run: |
          tar -czf cloud-node-rust-toa-main-source.tar.gz toa-main
          tar -czf cloud-node-rust-toa-sender-source.tar.gz toa-sender

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-body/body.md
          files: |
            artifacts/**/*.tar.gz
            cloud-node-rust-toa-main-source.tar.gz
            cloud-node-rust-toa-sender-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
