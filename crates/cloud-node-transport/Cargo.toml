[package]
name = "cloud-node-transport"
version = "0.1.0"
edition = "2024"
description = "Pure transport algorithms for the edge dataplane: TCP-rate sampling (Linux tcp_rate.c semantics), congestion-controller trait, NewReno/PRR and CUBIC+HyStart++, and a deterministic network simulator. No tokio/smoltcp/quinn dependencies — reusable by userspace stacks and tests."
publish = false

[dev-dependencies]
# T3-10 comparison: patched workspace-wide to vendor/smoltcp-edge, which
# still ships the upstream `congestion::cubic::Cubic` as the reference.
smoltcp = { version = "0.14.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "socket-tcp-cubic",
] }

[lints.rust]
unsafe_code = "forbid"
